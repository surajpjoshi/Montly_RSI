name: Update Monthly RSI Watchlist

on:
  schedule:
    # 7:30 PM IST = 14:00 UTC, Monday-Friday
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI scanner
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          STOCK_MASTER_FILE: stock_master(2).xlsx
          UPSTOX_WORKERS: '5'
          UPSTOX_TIMEOUT: '20'
        run: python monthly_rsi_watchlist.py

      - name: Publish CSV to dashboard
        run: |
          test -f data/watchlist.csv || cp data/watchlist.csv data/watchlist.csv

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m 'Update Monthly RSI watchlist'
          git push
